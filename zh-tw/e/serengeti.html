<h1>🦁 塞倫蓋蒂國家公園</h1>
<p class="place">坦尚尼亞・塞倫蓋蒂</p>
<p class="date"><strong>最佳季節：6–10 月乾季動物集中；7–9 月有渡河大遷徙</strong></p>
<p class="lead">東非無邊無際的草原，每年上百萬隻牛羚和斑馬在這裡和肯亞的馬賽馬拉之間大遷徙，獅子、獵豹、大象到處都看得到。</p>
<h2>行前提醒</h2>
<ul><li>跟獵遊團從阿魯沙出發，搭小飛機進園可以省下一天車程。</li><li>渡河大遷徙在北邊的馬拉河一帶，想看要選對月份和營地。</li></ul>
