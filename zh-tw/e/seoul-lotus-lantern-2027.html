<h1>🪷 首爾燃燈會</h1>
<p class="place">韓國・首爾</p>
<p class="date"><strong>往年：佛誕（農曆四月初八）前的週末；2027 年佛誕為 5/13<span class="tba">日期未公布</span></strong></p>
<p class="lead">聯合國非物質文化遺產，慶祝佛誕的燈節，數十萬盞蓮花燈和巨型燈籠從東大門遊行到曹溪寺，鐘路一帶有傳統文化市集。</p>
<h2>行前提醒</h2>
<ul><li>遊行在週六晚上，鐘路沿線要提早找位子。</li><li>週日在曹溪寺前有傳統文化街，可以自己做蓮花燈。</li></ul>
