<h1>☸️ 婆羅浮屠</h1>
<p class="place">印尼・日惹</p>
<p class="date"><strong>最佳季節：5–9 月乾季，日出時常有雲海</strong></p>
<p class="lead">世界最大的佛教寺廟，九層石造壇城上有兩千多面浮雕和 72 座鐘形佛塔。清晨火山和叢林被霧氣包圍，是爪哇最動人的景色。</p>
<h2>行前提醒</h2>
<ul><li>登上塔頂要另外預約限量時段，並換上寺方提供的草鞋。</li><li>在附近的 Setumbu 山丘看日出，可以拍到整座寺和火山。</li></ul>
