<h1>🎆 澎湖國際海上花火節</h1>
<p class="place">台灣・澎湖馬公</p>
<p class="date"><strong>往年：每年 5 月初到 8 月下旬，每週固定晚間施放（2026 年為 5/4–8/25）<span class="tba">日期未公布</span></strong></p>
<p class="lead">每年夏天在馬公觀音亭海上施放的煙火季，搭配無人機燈光秀，整季約 30 場，可以順便跳島、看海和吃海鮮。</p>
<h2>行前提醒</h2>
<ul><li>往返澎湖的機位和船位很快滿，要提早訂。</li><li>施放日固定在每週一、四或週二晚上，出發前看官方場次表。</li></ul>
