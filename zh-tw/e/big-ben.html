<h1>🕰️ 大笨鐘與西敏宮</h1>
<p class="place">英國・倫敦</p>
<p class="date"><strong>最佳季節：5–9 月，白天長、天氣最好</strong></p>
<p class="lead">泰晤士河畔的英國國會大廈和伊莉莎白塔（大笨鐘），哥德復興式的尖塔是倫敦最有代表性的畫面，旁邊就是西敏寺。</p>
<h2>行前提醒</h2>
<ul><li>國會大廈週六有導覽，英國居民才能預約登鐘塔。</li><li>西敏橋和對岸的南岸是拍大笨鐘的最佳位置。</li></ul>
