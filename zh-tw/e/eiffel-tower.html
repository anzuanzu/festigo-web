<h1>🗼 艾菲爾鐵塔</h1>
<p class="place">法國・巴黎</p>
<p class="date"><strong>最佳季節：4–6 月、9–10 月，天氣好、白天長</strong></p>
<p class="lead">巴黎最經典的地標，1889 年萬國博覽會時建造的鐵塔。登上塔頂可以看整座巴黎，入夜後每個整點會閃爍五分鐘。</p>
<h2>行前提醒</h2>
<ul><li>官網門票開賣就要搶，塔頂票常提早售完。</li><li>夏樂宮廣場和戰神廣場是拍鐵塔的最佳位置。</li></ul>
