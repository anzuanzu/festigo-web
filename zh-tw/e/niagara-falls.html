<h1>🌈 尼加拉瀑布</h1>
<p class="place">加拿大・尼加拉瀑布城</p>
<p class="date"><strong>最佳季節：6–9 月遊船全開；冬天瀑布會部分結冰</strong></p>
<p class="lead">橫跨美加邊境的巨大瀑布群，每秒數千噸的水從馬蹄瀑布傾瀉而下。搭船駛進瀑布底下的水霧裡，是最震撼的體驗。</p>
<h2>行前提醒</h2>
<ul><li>加拿大這一側看馬蹄瀑布的角度最好。</li><li>夏天每晚有瀑布燈光秀，週末還有煙火。</li></ul>
