<h1>🕯️ 塞維亞聖週</h1>
<p class="place">西班牙・塞維亞</p>
<p class="date"><strong>2027年3月21日－28日</strong></p>
<p class="lead">西班牙最壯觀的宗教遊行，復活節前一週，60 多個兄弟會抬著數百公斤的聖像穿過舊城，戴尖帽的懺悔者、銅管樂和聖歌徹夜不停。</p>
<h2>行前提醒</h2>
<ul><li>聖週四深夜到週五清晨（La Madrugá）是最重要的遊行時段。</li><li>想坐著看可以買官方座位區（Carrera Oficial）的票。</li></ul>
