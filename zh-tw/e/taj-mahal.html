<h1>🕌 泰姬瑪哈陵</h1>
<p class="place">印度・阿格拉</p>
<p class="date"><strong>最佳季節：10–3 月，涼爽乾燥；日出時大理石泛著粉色</strong></p>
<p class="lead">蒙兀兒皇帝沙賈汗為亡妻建造的白色大理石陵墓，對稱的庭園和倒影池讓它看起來像飄在空中，世界新七大奇蹟之一。</p>
<h2>行前提醒</h2>
<ul><li>週五不開放；日出開門時進去人最少、光線最美。</li><li>從德里搭快車約 2 小時，可以當天來回。</li></ul>
