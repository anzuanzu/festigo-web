<h1>🌙 聖索菲亞大教堂</h1>
<p class="place">土耳其・伊斯坦堡</p>
<p class="date"><strong>最佳季節：4–5 月鬱金香季、9–10 月</strong></p>
<p class="lead">建於西元 537 年的巨型圓頂建築，先後是拜占庭大教堂和鄂圖曼清真寺，金色馬賽克和阿拉伯文巨型圓牌並存，見證東西方千年歷史。</p>
<h2>行前提醒</h2>
<ul><li>現在是清真寺，禮拜時間不開放參觀，女性要包頭巾。</li><li>對面的藍色清真寺和地下水宮殿走路就到。</li></ul>
