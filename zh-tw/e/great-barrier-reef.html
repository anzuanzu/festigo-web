<h1>🐠 大堡礁</h1>
<p class="place">澳洲・凱恩斯</p>
<p class="date"><strong>最佳季節：6–10 月乾季，海水清、沒有水母</strong></p>
<p class="lead">世界最大的珊瑚礁系統，延伸兩千多公里，從太空都看得到。浮潛或潛水可以看到珊瑚、海龜和成群熱帶魚。</p>
<h2>行前提醒</h2>
<ul><li>從凱恩斯或道格拉斯港搭船到外堡礁，珊瑚狀況比近岸好。</li><li>11–5 月有箱形水母，下水要穿防護衣。</li></ul>
