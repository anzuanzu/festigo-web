<h1>🏺 佩特拉古城</h1>
<p class="place">約旦・瓦地穆沙</p>
<p class="date"><strong>最佳季節：3–5 月、9–11 月，不冷不熱</strong></p>
<p class="lead">納巴泰人在玫瑰色砂岩上雕出的古城。穿過一公里長的蛇道峽谷，眼前出現寶庫的那一刻最難忘；爬 800 級階梯還能到修道院。</p>
<h2>行前提醒</h2>
<ul><li>買約旦通行證（Jordan Pass）可以免簽證費、含門票。</li><li>早上 6 點開門就進去，才能拍到沒人的寶庫。</li></ul>
