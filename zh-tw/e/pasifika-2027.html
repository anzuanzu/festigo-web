<p class="place">紐西蘭・奧克蘭</p>
<p class="date"><strong>往年：每年 3 月中旬的週末（2026 年為 3/14–3/15）<span class="tba">日期未公布</span></strong></p>
<p class="lead">南半球最大的太平洋島民文化節，薩摩亞、東加、斐濟、庫克群島等島國各自搭建村落，有傳統舞蹈、音樂和島嶼料理，免費入場。</p>
<h2>行前提醒</h2>
<ul><li>每個島國村落的料理都不同，空著肚子去。</li><li>會場在西泉公園，搭公車或接駁車，現場停車位很少。</li></ul>
