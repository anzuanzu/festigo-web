<h1>🏞️ 班夫國家公園</h1>
<p class="place">加拿大・班夫</p>
<p class="date"><strong>最佳季節：6–9 月湖水最藍；12–3 月滑雪</strong></p>
<p class="lead">加拿大洛磯山脈的心臟，露易絲湖和夢蓮湖的湖水是不可思議的土耳其藍，四周是冰河和雪峰，常有麋鹿和熊出沒。</p>
<h2>行前提醒</h2>
<ul><li>夢蓮湖不開放自駕，要搭 Parks Canada 接駁車或觀光巴士。</li><li>沿冰原大道往北開，沿途是一連串冰河湖。</li></ul>
