<h1>🦜 伊瓜蘇瀑布</h1>
<p class="place">阿根廷・伊瓜蘇港</p>
<p class="date"><strong>最佳季節：3–5 月、8–11 月，水量大又不會太熱</strong></p>
<p class="lead">阿根廷和巴西邊境綿延近三公里的 275 道瀑布，站在「魔鬼咽喉」的步道盡頭，四面都是轟隆作響的水牆。</p>
<h2>行前提醒</h2>
<ul><li>阿根廷側走步道貼近瀑布，巴西側看全景，最好兩邊都去。</li><li>帶雨衣和防水袋，靠近瀑布一定會濕透。</li></ul>
