<h1>⚔️ 秦始皇兵馬俑</h1>
<p class="place">中國・西安</p>
<p class="date"><strong>最佳季節：3–5 月、9–11 月，避開夏天酷熱</strong></p>
<p class="lead">守護秦始皇陵兩千多年的地下大軍，數千尊真人大小的陶俑，每一尊的臉都不一樣。一號坑的軍陣最震撼，至今仍在挖掘。</p>
<h2>行前提醒</h2>
<ul><li>請一位現場導覽或租語音導覽，才看得懂各坑的差別。</li><li>從西安市區搭遊 5 號線（306 路）約一小時。</li></ul>
