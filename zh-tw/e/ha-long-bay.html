<h1>🐉 下龍灣</h1>
<p class="place">越南・下龍</p>
<p class="date"><strong>最佳季節：3–5 月、9–11 月，天氣穩定</strong></p>
<p class="lead">近兩千座石灰岩島嶼從翠綠海面拔起，傳說是神龍降下守護越南時吐出的珠玉。搭船過夜、划獨木舟穿過鐘乳石洞最難忘。</p>
<h2>行前提醒</h2>
<ul><li>選兩天一夜的遊船，才能去人少的蘭夏灣。</li><li>颱風季（7–9 月）遊船可能停航，行程要保留彈性。</li></ul>
