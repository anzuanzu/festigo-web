<h1>☀️ 阿布辛貝神殿</h1>
<p class="place">埃及・阿布辛貝</p>
<p class="date"><strong>最佳季節：10–4 月；2 月 22 日、10 月 22 日太陽照進神殿深處</strong></p>
<p class="lead">拉美西斯二世在努比亞岩壁上鑿出的神殿，四尊 20 公尺高的法老坐像守在門口。1960 年代為了興建水壩，整座神殿被切塊往上搬了 65 公尺。</p>
<h2>行前提醒</h2>
<ul><li>從亞斯文清晨出發的車隊或小飛機最方便。</li><li>太陽節前後住宿和交通很搶手，要提早訂。</li></ul>
