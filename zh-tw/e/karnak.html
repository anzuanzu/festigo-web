<h1>🪲 卡納克神廟</h1>
<p class="place">埃及・路克索</p>
<p class="date"><strong>最佳季節：10–4 月，避開夏天的酷熱</strong></p>
<p class="lead">古埃及最大的神廟群，歷代法老擴建了兩千年。134 根巨柱組成的多柱大廳高 21 公尺，站在中間像走進石頭森林。</p>
