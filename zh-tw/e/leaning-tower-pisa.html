<h1>🔔 比薩斜塔</h1>
<p class="place">義大利・比薩</p>
<p class="date"><strong>最佳季節：4–6 月、9–10 月</strong></p>
<p class="lead">奇蹟廣場上傾斜將近四度的大理石鐘樓，和大教堂、洗禮堂排在一片草地上。爬上 251 級螺旋梯，可以感受塔身真的是斜的。</p>
<h2>行前提醒</h2>
<ul><li>登塔要預約時段，8 歲以下不能上去。</li><li>從佛羅倫斯搭火車約一小時，可以當天來回。</li></ul>
