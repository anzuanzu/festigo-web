<h1>🏜️ 大峽谷</h1>
<p class="place">美國・亞利桑那</p>
<p class="date"><strong>最佳季節：3–5 月、9–11 月；北緣只在 5–10 月開放</strong></p>
<p class="lead">科羅拉多河花了數百萬年切出的大峽谷，深 1.6 公里、長 446 公里，層層紅色岩壁在日出日落時不斷變色。</p>
<h2>行前提醒</h2>
<ul><li>南緣全年開放、設施最多；Mather Point 看日出最經典。</li><li>夏天谷底超過 40 度，不要一天往返谷底。</li></ul>
