<h1>🏮 故宮（紫禁城）</h1>
<p class="place">中國・北京</p>
<p class="date"><strong>最佳季節：4–5 月、9–10 月，天氣舒服、天空最藍</strong></p>
<p class="lead">明清兩代的皇宮，世界現存規模最大的木造宮殿群，九千多間房間、金黃屋頂連成一片。現在是故宮博物院，每天限量入場。</p>
<h2>行前提醒</h2>
<ul><li>門票只在官網實名預約，旺季常提前一週售完。</li><li>週一閉館（國定假日除外）；北邊景山公園可以看整座紫禁城的屋頂。</li></ul>
