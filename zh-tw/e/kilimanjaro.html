<h1>🏔️ 吉力馬札羅山</h1>
<p class="place">坦尚尼亞・莫希</p>
<p class="date"><strong>最佳季節：1–3 月、6–10 月乾季，登頂成功率最高</strong></p>
<p class="lead">非洲最高峰，海拔 5,895 公尺、赤道附近卻頂著冰河。不需要攀岩技術，健行六到八天就能登頂，從熱帶雨林一路走到冰原。</p>
<h2>行前提醒</h2>
<ul><li>一定要跟有執照的登山公司，選天數多的路線比較好適應高度。</li><li>不登頂的話，從莫希或安博塞利也能看到山頭。</li></ul>
