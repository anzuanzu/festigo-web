<h1>🌇 外灘</h1>
<p class="place">中國・上海</p>
<p class="date"><strong>最佳季節：3–5 月、10–11 月，涼爽、適合散步看夜景</strong></p>
<p class="lead">黃浦江畔一字排開的萬國建築博覽群，對岸就是陸家嘴的摩天大樓。白天看百年老洋行，晚上燈一亮，兩岸天際線是上海最經典的畫面。</p>
<h2>行前提醒</h2>
<ul><li>晚上 7–10 點亮燈最漂亮，假日人潮很多。</li><li>搭黃浦江遊船或渡輪，可以從江上看兩岸夜景。</li></ul>
