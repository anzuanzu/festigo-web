<h1>👑 大皇宮與玉佛寺</h1>
<p class="place">泰國・曼谷</p>
<p class="date"><strong>最佳季節：11–2 月涼季，不那麼熱也少下雨</strong></p>
<p class="lead">泰國皇室的宮殿群，金光閃閃的佛塔、彩色馬賽克和守護神像密密麻麻，玉佛寺供奉全國最神聖的翡翠玉佛。</p>
<h2>行前提醒</h2>
<ul><li>服裝要遮肩膝，不能穿短褲、無袖或緊身褲。</li><li>一開門 8:30 就去，避開中午的熱和旅行團。</li></ul>
