<h1>🗽 自由女神像</h1>
<p class="place">美國・紐約</p>
<p class="date"><strong>最佳季節：4–6 月、9–11 月，天氣舒服</strong></p>
<p class="lead">法國送給美國的獨立百年賀禮，舉著火炬站在紐約港口迎接移民超過一百年。渡輪會順路停艾利斯島移民博物館。</p>
<h2>行前提醒</h2>
<ul><li>只有官方渡輪（Statue City Cruises）能登島，登冠要提早幾個月預約。</li><li>不登島的話，免費的史坦頓島渡輪也能從海上看女神像。</li></ul>
