<h1>⛪ 聖彼得大教堂與西斯汀禮拜堂</h1>
<p class="place">義大利（梵蒂岡）・梵蒂岡</p>
<p class="date"><strong>最佳季節：11–3 月淡季，避開復活節和暑假</strong></p>
<p class="lead">天主教的中心，世界最大的教堂，米開朗基羅設計的圓頂可以登頂俯瞰羅馬。旁邊梵蒂岡博物館裡的西斯汀禮拜堂有《創世紀》和《最後的審判》。</p>
<h2>行前提醒</h2>
<ul><li>服裝要遮肩膝；大教堂免費但排隊安檢可能要一小時。</li><li>梵蒂岡博物館一定要先網路預約，週日休館（每月最後一個週日除外）。</li></ul>
