<h1>🧱 萬里長城</h1>
<p class="place">中國・北京</p>
<p class="date"><strong>最佳季節：4–5 月、9–10 月，不冷不熱，秋天滿山紅葉</strong></p>
<p class="lead">綿延上萬公里的防禦工事，世界新七大奇蹟之一。北京近郊的慕田峪段修復完整、坡道和纜車都有，八達嶺段最有名但人潮也最多。</p>
<h2>行前提醒</h2>
<ul><li>避開國慶黃金週（10 月 1–7 日），人潮少很多。</li><li>慕田峪可以搭纜車上、滑道下，省力又好玩。</li></ul>
