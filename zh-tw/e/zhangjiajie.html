<h1>⛰️ 張家界國家森林公園</h1>
<p class="place">中國・張家界</p>
<p class="date"><strong>最佳季節：4–5 月、9–10 月；雨後常有雲海</strong></p>
<p class="lead">數千根石英砂岩柱從森林裡直直竄出，雲霧繚繞時像漂浮在空中，是電影《阿凡達》懸浮山的靈感來源。</p>
<h2>行前提醒</h2>
<ul><li>門票四天有效，至少待兩天才逛得完袁家界和天子山。</li><li>天門山的玻璃棧道和 999 級天梯在市區另一邊，要另外排一天。</li></ul>
