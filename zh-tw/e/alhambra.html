<h1>🌹 阿罕布拉宮</h1>
<p class="place">西班牙・格拉納達</p>
<p class="date"><strong>最佳季節：3–5 月、9–11 月，花園最美、不會太熱</strong></p>
<p class="lead">摩爾人在西班牙留下的最後宮殿，納斯里宮的鐘乳石天花板和阿拉伯文雕飾細緻得驚人，夕陽下整座宮殿映著內華達山的雪頂。</p>
<h2>行前提醒</h2>
<ul><li>每天限量入場，旺季要提前一個月以上訂票，並準時在納斯里宮時段入場。</li><li>傍晚到對面的聖尼古拉斯觀景台看夕陽下的阿罕布拉宮。</li></ul>
