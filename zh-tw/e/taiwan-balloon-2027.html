<h1>🎈 台灣國際熱氣球嘉年華</h1>
<p class="place">台灣・台東鹿野</p>
<p class="date"><strong>往年：每年 7 月上旬至 8 月下旬（2026 年為 7/4–8/20）<span class="tba">日期未公布</span></strong></p>
<p class="lead">夏天在台東鹿野高台的清晨與黃昏，數十顆造型熱氣球同時升空，還有光雕音樂會和繫留體驗，可以順遊花東縱谷。</p>
<h2>行前提醒</h2>
<ul><li>繫留體驗要提前上網預約，名額常秒殺。</li><li>只有清晨和黃昏升空，週二公休，風大會取消。</li></ul>
