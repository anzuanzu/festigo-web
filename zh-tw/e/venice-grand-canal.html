<h1>🛶 威尼斯大運河與聖馬可廣場</h1>
<p class="place">義大利・威尼斯</p>
<p class="date"><strong>最佳季節：4–5 月、9–10 月，避開夏季人潮和冬季水淹</strong></p>
<p class="lead">蓋在 118 座小島上的水都，S 形的大運河兩岸是哥德式和文藝復興宮殿。聖馬可廣場被拿破崙稱為「歐洲最美的客廳」。</p>
<h2>行前提醒</h2>
<ul><li>部分日子當天來回的遊客要先上網付入城費，出發前查官網。</li><li>搭 1 號水上巴士從頭坐到尾，就是最便宜的大運河遊船。</li></ul>
