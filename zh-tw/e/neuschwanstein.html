<h1>🏰 新天鵝堡</h1>
<p class="place">德國・施萬高</p>
<p class="date"><strong>最佳季節：9–10 月秋色、12–2 月雪景</strong></p>
<p class="lead">巴伐利亞「童話國王」路德維希二世的夢幻城堡，白色塔樓立在阿爾卑斯山腳的峭壁上，據說是迪士尼睡美人城堡的靈感。</p>
<h2>行前提醒</h2>
<ul><li>城堡內部只能跟導覽參觀，要提前預約時段。</li><li>瑪麗恩橋是拍城堡全景的最佳位置。</li></ul>
