<h1>🛕 吳哥窟</h1>
<p class="place">柬埔寨・暹粒</p>
<p class="date"><strong>最佳季節：11–3 月乾季，日出最容易看到</strong></p>
<p class="lead">世界最大的宗教建築，十二世紀的高棉帝國傑作。五座蓮花塔倒映在水池裡的日出是招牌畫面，附近還有巴戎寺的微笑佛面和被樹根纏繞的塔普倫寺。</p>
<h2>行前提醒</h2>
<ul><li>買三日票慢慢逛，比一日票值得。</li><li>日出要 5 點前到西池卡位，嘟嘟車可以前一晚先約。</li></ul>
