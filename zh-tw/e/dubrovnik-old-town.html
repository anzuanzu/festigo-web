<h1>⚓ 杜布羅夫尼克古城</h1>
<p class="place">克羅埃西亞・杜布羅夫尼克</p>
<p class="date"><strong>最佳季節：5–6 月、9–10 月，避開郵輪人潮最多的盛夏</strong></p>
<p class="lead">「亞得里亞海之珠」，紅瓦屋頂被完整的中世紀城牆圍住，是《冰與火之歌：權力遊戲》君臨城的拍攝地。</p>
<h2>行前提醒</h2>
<ul><li>城牆走一圈約兩小時，早上 8 點開門就上去才不會太熱。</li><li>搭纜車上斯爾吉山，可以俯瞰整座古城和海。</li></ul>
