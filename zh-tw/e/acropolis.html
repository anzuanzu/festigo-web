<h1>🏛️ 雅典衛城</h1>
<p class="place">希臘・雅典</p>
<p class="date"><strong>最佳季節：4–6 月、9–10 月，避開盛夏烈日</strong></p>
<p class="lead">西方文明的搖籃，山丘上的帕德嫩神廟已經屹立兩千五百年。從衛城可以看到整個雅典和遠方的愛琴海。</p>
<h2>行前提醒</h2>
<ul><li>門票要預約入場時段，一開門 8 點就上去最涼快。</li><li>對面的菲洛帕波斯山丘是拍衛城夕陽的好地方。</li></ul>
