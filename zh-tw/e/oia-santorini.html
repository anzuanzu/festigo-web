<h1>🌅 聖托里尼伊亞小鎮</h1>
<p class="place">希臘・聖托里尼</p>
<p class="date"><strong>最佳季節：5–6 月、9–10 月，天氣好又沒那麼擠</strong></p>
<p class="lead">火山口邊緣層層疊疊的白屋和藍色圓頂教堂，伊亞小鎮的夕陽被稱為世界最美的日落之一。</p>
<h2>行前提醒</h2>
<ul><li>看夕陽要提早一兩小時到城堡遺跡卡位。</li><li>從費拉沿火山口步道走到伊亞約三小時，風景一路都美。</li></ul>
