<h1>🪨 巨石陣</h1>
<p class="place">英國・索爾茲伯里</p>
<p class="date"><strong>最佳季節：6 月夏至、12 月冬至；春秋人較少</strong></p>
<p class="lead">五千年前的史前巨石陣，數十塊巨石排成圓環，對準夏至日出和冬至日落，至今仍不知道古人怎麼搬運和建造。</p>
<h2>行前提醒</h2>
<ul><li>要預約入場時段；夏至清晨開放走進石陣內。</li><li>從倫敦搭火車到索爾茲伯里，再轉觀光巴士。</li></ul>
