<p class="place">法國・里昂</p>
<p class="date"><strong>2026年12月5日－8日</strong></p>
<p class="lead">里昂每年 12 月 8 日前後的燈光節，整座老城的教堂、廣場和河岸變成光雕舞台，四個晚上吸引數百萬人，源自居民在窗台點蠟燭感謝聖母的傳統。</p>
<h2>行前提醒</h2>
<ul><li>白萊果廣場和富維耶山是主要展區，週末最擠。</li><li>里昂飯店在燈光節期間早早滿房，可以住鄰近城市搭火車進城。</li></ul>
