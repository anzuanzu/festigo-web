<h1>🌉 布拉格城堡與查理大橋</h1>
<p class="place">捷克・布拉格</p>
<p class="date"><strong>最佳季節：4–6 月、9–10 月；12 月有聖誕市集</strong></p>
<p class="lead">世界最大的古城堡建築群，聖維特大教堂的尖塔俯視伏爾塔瓦河。走下山經過小城區，就是兩旁立滿聖像的查理大橋。</p>
<h2>行前提醒</h2>
<ul><li>城堡庭院免費，進大教堂、黃金巷要買套票。</li><li>清晨 6 點前的查理大橋幾乎沒有人。</li></ul>
