<h1>🏯 景福宮</h1>
<p class="place">韓國・首爾</p>
<p class="date"><strong>最佳季節：4 月櫻花、10 月楓葉，春秋最美</strong></p>
<p class="lead">朝鮮王朝的正宮，背倚北岳山，勤政殿和倒映在池中的慶會樓最有名。穿韓服入場免費，宮裡到處是穿著傳統服裝拍照的遊客。</p>
<h2>行前提醒</h2>
<ul><li>每天 10 點和 14 點在光化門有守門將換班儀式。</li><li>週二休館；門口附近有很多韓服租借店。</li></ul>
