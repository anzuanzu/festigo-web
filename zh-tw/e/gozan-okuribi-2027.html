<p class="place">日本・京都</p>
<p class="date"><strong>2027年8月16日</strong></p>
<p class="lead">每年 8 月 16 日盂蘭盆節最後一晚，京都五座山依序點燃「大」字等火字，送祖先的靈魂回去。</p>
<h2>行前提醒</h2>
<ul><li>晚上 8 點起依序點火，鴨川河岸和船岡山是熱門觀賞點。</li><li>盂蘭盆期間京都住宿和新幹線都很擠，要提早預訂。</li></ul>
