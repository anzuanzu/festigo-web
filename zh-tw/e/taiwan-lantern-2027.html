<h1>🏮 台灣燈會</h1>
<p class="place">台灣・苗栗後龍</p>
<p class="date"><strong>往年：每年元宵節前後約兩週；2027 年苗栗縣主辦，展期暫定 2/20–3/7<span class="tba">日期未公布</span></strong></p>
<p class="lead">全台規模最大的元宵燈會，2027 年由苗栗主辦，燈區集中在高鐵苗栗站周邊，以「山海之間．慢城光苗」為主題，有主燈秀、全國花燈競賽與無人機表演。</p>
<h2>行前提醒</h2>
<ul><li>搭高鐵到苗栗站出站就是燈區，比開車方便很多。</li><li>苗栗住宿少，可以住新竹或台中，搭高鐵往返。</li></ul>
