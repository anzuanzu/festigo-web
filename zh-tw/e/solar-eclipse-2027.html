<h1>🌑 世紀日全食（路克索）</h1>
<p class="place">埃及・路克索</p>
<p class="date"><strong>2027年8月2日</strong></p>
<p class="lead">本世紀在陸地上能看到最長的日全食，路克索全食約 6 分 20 秒，太陽會在卡納克神殿和帝王谷上空消失，下一次這麼長要等到 2114 年。</p>
<h2>行前提醒</h2>
<ul><li>路克索飯店已經有人提早一年預訂，看日食的行程要越早訂越好。</li><li>要戴符合 ISO 12312-2 標準的日食眼鏡，只有全食那幾分鐘可以拿下來。</li></ul>
