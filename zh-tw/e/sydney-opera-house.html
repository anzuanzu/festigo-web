<h1>🎭 雪梨歌劇院與港灣大橋</h1>
<p class="place">澳洲・雪梨</p>
<p class="date"><strong>最佳季節：9–11 月春天、3–5 月秋天，溫暖不悶熱</strong></p>
<p class="lead">像一片片白帆的歌劇院和「衣架」港灣大橋，一起組成雪梨港最經典的畫面。可以進歌劇院看表演，或爬上大橋拱頂。</p>
<h2>行前提醒</h2>
<ul><li>歌劇院導覽一小時，看表演比導覽更值得。</li><li>搭渡輪到曼利海灘，沿途看歌劇院和大橋。</li></ul>
