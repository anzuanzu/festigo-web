<h1>💦 維多利亞瀑布</h1>
<p class="place">辛巴威・維多利亞瀑布城</p>
<p class="date"><strong>最佳季節：2–5 月水量最大；8–12 月水少但看得清楚岩壁</strong></p>
<p class="lead">尚比西河在辛巴威和尚比亞邊境落下 108 公尺，寬 1.7 公里，當地人叫它「轟隆作響的煙霧」，水霧幾十公里外都看得到。</p>
<h2>行前提醒</h2>
<ul><li>辛巴威側能看到大部分瀑布；可以辦 KAZA 通用簽證兩國都去。</li><li>豐水期一定會被淋濕，帶雨衣或租現場雨衣。</li></ul>
