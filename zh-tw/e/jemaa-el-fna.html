<h1>🫖 傑馬夫納廣場與馬拉喀什老城</h1>
<p class="place">摩洛哥・馬拉喀什</p>
<p class="date"><strong>最佳季節：3–5 月、9–11 月，避開夏天的高溫</strong></p>
<p class="lead">馬拉喀什老城的心臟，白天是果汁攤和耍蛇人，入夜後變成冒著煙的露天大食堂，四周是迷宮般的傳統市集。</p>
