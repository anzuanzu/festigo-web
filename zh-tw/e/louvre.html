<h1>🖼️ 羅浮宮</h1>
<p class="place">法國・巴黎</p>
<p class="date"><strong>最佳季節：11–3 月淡季人較少</strong></p>

<ul><li>一定要預約入場時段；週二休館。</li><li>週五晚上延長開放，人比白天少。</li></ul>
