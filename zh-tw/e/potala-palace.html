<h1>🙏 布達拉宮</h1>
<p class="place">中國・拉薩</p>
<p class="date"><strong>最佳季節：5–10 月，天氣溫和、道路暢通</strong></p>
<p class="lead">矗立在海拔 3,700 公尺紅山上的宮堡，曾是達賴喇嘛的冬宮，紅白兩色的宮牆層層疊上山頂，是藏傳佛教最重要的聖地之一。</p>
<h2>行前提醒</h2>
<ul><li>外國旅客（含港澳台）要透過旅行社申請入藏許可並跟團。</li><li>先在拉薩休息一兩天適應高海拔，再爬宮內的階梯。</li></ul>
