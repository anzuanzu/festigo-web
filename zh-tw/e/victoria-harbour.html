<h1>⛴️ 維多利亞港</h1>
<p class="place">中國香港・香港</p>
<p class="date"><strong>最佳季節：10–12 月，乾爽涼快、空氣最清澈</strong></p>
<p class="lead">夾在香港島和九龍之間的天然深水港，兩岸摩天大樓沿著山勢排開。從尖沙咀海濱或太平山頂看夜景，是世界最有名的城市天際線之一。</p>
<h2>行前提醒</h2>
<ul><li>天星小輪只要幾塊港幣，是看維港最划算的方式。</li><li>每晚 8 點有「幻彩詠香江」燈光秀，在尖沙咀海濱看最清楚。</li></ul>
