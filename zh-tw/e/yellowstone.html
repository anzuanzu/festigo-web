<h1>♨️ 黃石國家公園</h1>
<p class="place">美國・懷俄明</p>
<p class="date"><strong>最佳季節：5–9 月道路全開；冬天大部分道路封閉</strong></p>
<p class="lead">世界第一座國家公園，地球上一半以上的間歇泉都在這裡。老忠實泉準時噴發，大稜鏡溫泉像一道彩虹，還常看到野牛和灰熊。</p>
<h2>行前提醒</h2>
<ul><li>園內住宿常在一年前就訂滿，要早點訂。</li><li>一定要走木棧道，溫泉地表很薄、水溫極高。</li></ul>
