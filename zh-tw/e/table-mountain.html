<h1>🚡 桌山</h1>
<p class="place">南非・開普敦</p>
<p class="date"><strong>最佳季節：11–3 月夏季，晴天多；風大時纜車會停</strong></p>
<p class="lead">開普敦背後平頂的千公尺高山，搭旋轉纜車上山，可以看到整座城市、羅本島和大西洋，山頂常被「桌巾雲」覆蓋。</p>
<h2>行前提醒</h2>
<ul><li>出發前查纜車官網，風大或起霧就會暫停。</li><li>體力好可以走 Platteklip Gorge 步道上山，約兩小時。</li></ul>
