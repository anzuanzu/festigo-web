<h1>🛥️ 米佛峽灣</h1>
<p class="place">紐西蘭・蒂阿瑙</p>
<p class="date"><strong>最佳季節：11–3 月夏季；下雨天反而有上百道瀑布</strong></p>
<p class="lead">冰河切出的峽灣，懸崖直直插入海裡，主教冠峰倒映在水面。搭船穿過峽灣到塔斯曼海口，常看到海豹和海豚。</p>
<h2>行前提醒</h2>
<ul><li>從皇后鎮來回開車要八小時，可以住蒂阿瑙或搭觀光小飛機。</li><li>沿途沒有加油站和手機訊號，出發前先加滿油。</li></ul>
