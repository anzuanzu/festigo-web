<h1>🗻 富士山</h1>
<p class="place">日本・富士河口湖</p>
<p class="date"><strong>最佳季節：11–2 月空氣清澈最容易看到；7–9 月登山季</strong></p>
<p class="lead">日本最高峰，完美的圓錐形火山被視為聖山。從河口湖、新倉山淺間公園的五重塔或山中湖都能看到倒映的山影，夏天可以登頂看日出。</p>
<h2>行前提醒</h2>
<ul><li>早上最容易看到富士山，中午以後常被雲遮住。</li><li>登山季要在官網預約、繳入山費，吉田路線每天限量。</li></ul>
