<h1>🪞 烏尤尼鹽湖</h1>
<p class="place">玻利維亞・烏尤尼</p>
<p class="date"><strong>最佳季節：1–3 月雨季有「天空之鏡」；5–10 月是一望無際的白色鹽原</strong></p>
<p class="lead">世界最大的鹽湖，一萬多平方公里的白色大地平得像鏡子，雨季積水時天空倒映在地面，分不清哪裡是天、哪裡是地。</p>
<h2>行前提醒</h2>
<ul><li>要跟當地吉普車團進去，挑評價好、有安全裝備的旅行社。</li><li>海拔 3,600 公尺，日夜溫差大，帶墨鏡、防曬和保暖衣物。</li></ul>
