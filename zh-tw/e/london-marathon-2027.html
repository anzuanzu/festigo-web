<h1>🏃 倫敦馬拉松</h1>
<p class="place">英國・倫敦</p>
<p class="date"><strong>2027年4月25日</strong></p>
<p class="lead">世界七大馬拉松之一，從格林威治出發，經過倫敦塔橋、金絲雀碼頭，終點在白金漢宮前的林蔭大道，以大量變裝跑者和慈善募款聞名。</p>
<h2>行前提醒</h2>
<ul><li>參賽靠抽籤（前一年 4 月報名，申請人數破百萬）或慈善名額；觀賽免費。</li><li>倫敦塔橋是跑者最難忘的路段，也是最擠的觀賽點，要提早到。</li></ul>
