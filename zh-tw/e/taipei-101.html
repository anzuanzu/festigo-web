<h1>🎋 台北101</h1>
<p class="place">台灣・台北</p>
<p class="date"><strong>最佳季節：10–12 月，秋冬天氣穩定、跨年夜有煙火</strong></p>
<p class="lead">曾是世界最高樓，外型像節節高升的竹子。89 樓觀景台和 101 樓天際線步道可以俯瞰整個台北盆地，88 樓還看得到穩住大樓的巨型風阻尼球。</p>
<h2>行前提醒</h2>
<ul><li>傍晚上去可以一次看到白天、夕陽和夜景。</li><li>象山步道走 20 分鐘就能拍到 101 和信義區天際線。</li></ul>
