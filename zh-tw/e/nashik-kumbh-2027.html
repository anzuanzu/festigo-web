<p class="place">印度・納西克</p>
<p class="date"><strong>2027年7月29日－9月12日</strong></p>
<p class="lead">12 年一次的印度大壺節，數千萬名信徒和苦行僧在戈達瓦里河聖浴，主沐浴日有聖者遊行，是地球上規模最大的人類聚會之一。</p>
<h2>行前提醒</h2>
<ul><li>三個主沐浴日（8/2、8/31、9/11）人潮最多，想近距離看可以挑前後幾天。</li><li>住官方帳篷營地或孟買，注意飲水衛生，貴重物品不要帶。</li></ul>
