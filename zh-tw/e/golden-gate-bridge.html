<h1>🌁 金門大橋</h1>
<p class="place">美國・舊金山</p>
<p class="date"><strong>最佳季節：9–10 月最少霧，天空最晴朗</strong></p>
<p class="lead">橫跨舊金山灣口的國際橘懸吊橋，常被海霧半遮住，是美國西岸最有名的畫面。可以走路或騎單車過橋。</p>
<h2>行前提醒</h2>
<ul><li>北端的 Battery Spencer 是拍大橋全景的經典位置。</li><li>租單車騎過橋到索薩利托，再搭渡輪回來。</li></ul>
