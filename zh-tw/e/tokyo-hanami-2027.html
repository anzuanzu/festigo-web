<h1>🌸 東京賞櫻季</h1>
<p class="place">日本・東京</p>
<p class="date"><strong>往年：每年 3 月下旬至 4 月上旬，依櫻花開花預報而定<span class="tba">日期未公布</span></strong></p>
<p class="lead">每年三月底到四月初，上野公園、目黑川、千鳥之淵開滿櫻花，夜櫻點燈更是浪漫。</p>
<h2>行前提醒</h2>
<ul><li>開花日期每年不同，出發前兩週再看最新的櫻花前線預報。</li><li>新宿御苑禁止飲酒，適合安靜賞花。</li></ul>
