<h1>⚽️ FIFA 女子世界盃</h1>
<p class="place">巴西・里約熱內盧</p>
<p class="date"><strong>2027年6月24日－7月25日</strong></p>
<p class="lead">首次在南美洲舉辦的女足世界盃，八個城市共 32 隊參賽。開幕戰與決賽場地尚未公布，馬拉卡納球場是熱門人選。</p>
<h2>行前提醒</h2>
<ul><li>小組賽分散在巴西多個城市，城市間建議搭飛機。</li><li>里約住宿以 Copacabana 和 Ipanema 最方便。</li></ul>
