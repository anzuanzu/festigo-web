<h1>⛩️ 伏見稻荷大社</h1>
<p class="place">日本・京都</p>
<p class="date"><strong>最佳季節：11 月楓紅、3–4 月櫻花季；清晨人最少</strong></p>
<p class="lead">全日本三萬多座稻荷神社的總本宮，上萬座朱紅鳥居沿著稻荷山排成隧道，「千本鳥居」是京都最具代表性的畫面。</p>
<h2>行前提醒</h2>
<ul><li>24 小時開放，早上 7 點前或傍晚去才拍得到沒人的鳥居。</li><li>爬到四之辻約 45 分鐘，可以俯瞰京都市區。</li></ul>
