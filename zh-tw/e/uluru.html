<h1>🦘 烏魯魯</h1>
<p class="place">澳洲・尤拉拉</p>
<p class="date"><strong>最佳季節：5–9 月涼爽，夏天白天常超過 40 度</strong></p>
<p class="lead">澳洲紅土中心拔地而起的巨大砂岩，是原住民阿南古人的聖地，日出日落時岩石會從橘紅變成深紫。</p>
<h2>行前提醒</h2>
<ul><li>岩石是聖地，已禁止攀爬；可以走 10 公里的環岩步道。</li><li>夏天帶防蠅網，蒼蠅非常多。</li></ul>
